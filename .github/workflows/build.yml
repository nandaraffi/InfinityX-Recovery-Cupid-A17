name: Build Cupid Recovery A17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEVICE: cupid
      SOURCE_DIR: twrp

      TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      TWRP_BRANCH: twrp-12.1

      DEVICE_TREE_REPO: https://github.com/yarpiin/twrp_device_xiaomi_cupid.git
      DEVICE_TREE_BRANCH: main

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------
      # FREE DISK SPACE
      # ---------------------------------------------------------
      - name: Free disk space
        shell: bash
        run: |
          set -eo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true

          sudo apt-get clean || true

          sudo docker system prune -af || true

          rm -rf "$HOME/.cache" || true
          rm -rf "$HOME/.gradle" || true
          rm -rf "$RUNNER_TOOL_CACHE" || true
          rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo "=== Disk space ==="
          df -h

      # ---------------------------------------------------------
      # BUILD DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -eo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses6 \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses6 \
            libncurses-dev \
            libssl-dev \
            lzop \
            openjdk-17-jdk \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

      # ---------------------------------------------------------
      # REPO TOOL
      # ---------------------------------------------------------
      - name: Install repo
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ---------------------------------------------------------
      # INIT TWRP 12.1 SOURCE
      # ---------------------------------------------------------
      - name: Initialize TWRP source
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$SOURCE_DIR"

          cd "$SOURCE_DIR"

          repo init \
            --depth=1 \
            --no-repo-verify \
            --git-lfs \
            -u "$TWRP_MANIFEST" \
            -b "$TWRP_BRANCH"

      # ---------------------------------------------------------
      # SYNC TWRP
      # ---------------------------------------------------------
      - name: Sync TWRP source
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

      # ---------------------------------------------------------
      # CHECK DEVICE TREE
      # ---------------------------------------------------------
      - name: Check Cupid recovery tree
        shell: bash
        run: |
          set -eo pipefail

          echo "Checking:"
          echo "$DEVICE_TREE_REPO"
          echo "Branch:"
          echo "$DEVICE_TREE_BRANCH"

          git ls-remote \
            --exit-code \
            --heads \
            "$DEVICE_TREE_REPO" \
            "$DEVICE_TREE_BRANCH"

      # ---------------------------------------------------------
      # CLONE DEVICE TREE
      # ---------------------------------------------------------
      - name: Clone Cupid recovery tree
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          mkdir -p device/xiaomi

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_REPO" \
            device/xiaomi/cupid

      # ---------------------------------------------------------
      # VERIFY DEVICE TREE
      # ---------------------------------------------------------
      - name: Verify Cupid recovery tree
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          TREE="device/xiaomi/cupid"

          echo "=== Cupid recovery tree ==="

          test -d "$TREE"

          test -f "$TREE/AndroidProducts.mk"
          test -f "$TREE/BoardConfig.mk"
          test -f "$TREE/device.mk"
          test -f "$TREE/twrp_cupid.mk"
          test -f "$TREE/Android.bp"

          test -f "$TREE/prebuilt/kernel"

          echo
          echo "=== Recovery features ==="

          test -d "$TREE/recovery/root"

          find "$TREE/recovery/root" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

          echo
          echo "=== BoardConfig ==="

          grep -E \
            '^(TARGET_ARCH|BOARD_KERNEL|BOARD_BOOTIMAGE|BOARD_RECOVERY|TW_|TARGET_RECOVERY)' \
            "$TREE/BoardConfig.mk" \
            || true

      # ---------------------------------------------------------
      # REMOVE GIT DATA TO SAVE SPACE
      # ---------------------------------------------------------
      - name: Remove device tree git data
        shell: bash
        run: |
          set -eo pipefail

          rm -rf \
            "$SOURCE_DIR/device/xiaomi/cupid/.git"

          echo "Device tree .git removed."

          df -h

      # ---------------------------------------------------------
      # CREATE BUILD ENVIRONMENT
      # ---------------------------------------------------------
      - name: Prepare TWRP environment
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          cat > .cupid-build-env.sh <<'EOF'
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export LANG=C
          export USE_CCACHE=0
          EOF

          cat .cupid-build-env.sh

      # ---------------------------------------------------------
      # CONFIGURE TWRP
      # ---------------------------------------------------------
      - name: Configure TWRP
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          source .cupid-build-env.sh

          # Android/TWRP envsetup uses optional shell variables.
          # Do NOT use nounset here.
          set +u

          source build/envsetup.sh

          lunch twrp_cupid-eng

          echo
          echo "=== Lunch result ==="

          get_build_var TARGET_PRODUCT
          get_build_var PRODUCT_DEVICE
          get_build_var TARGET_ARCH
          get_build_var TARGET_BUILD_VARIANT

          echo
          echo "=== Recovery variables ==="

          get_build_var TARGET_RECOVERY_FSTAB || true
          get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE || true
          get_build_var BOARD_BOOTIMAGE_PARTITION_SIZE || true

          set -u

      # ---------------------------------------------------------
      # BUILD RECOVERY
      # ---------------------------------------------------------
      - name: Build recovery image
        shell: bash
        run: |
          set -eo pipefail

          cd "$SOURCE_DIR"

          source .cupid-build-env.sh

          # Keep nounset disabled for Android build functions.
          set +u

          source build/envsetup.sh

          lunch twrp_cupid-eng

          # Injecting name for TWR version
          export TW_DEVICE_VERSION="-By Nndee V1"

          echo
          echo "========================================"
          echo " BUILDING CUPID RECOVERY"
          echo "========================================"

          mka recoveryimage -j2

          set -u

      # ---------------------------------------------------------
      # VALIDATE RESULT
      # ---------------------------------------------------------
      - name: Validate recovery
        shell: bash
        run: |
          set -eo pipefail

          RECOVERY="$SOURCE_DIR/out/target/product/$DEVICE/recovery.img"

          echo "Recovery:"
          echo "$RECOVERY"

          if [ ! -f "$RECOVERY" ]; then
            echo
            echo "ERROR: recovery.img was not generated."
            echo
            find "$SOURCE_DIR/out/target/product/$DEVICE" \
              -maxdepth 2 \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo
          echo "=== Recovery generated ==="

          ls -lh "$RECOVERY"

          file "$RECOVERY"

          sha256sum "$RECOVERY"

      # ---------------------------------------------------------
      # PACKAGE
      # ---------------------------------------------------------
      - name: Prepare artifacts
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p artifacts

          cp \
            "$SOURCE_DIR/out/target/product/$DEVICE/recovery.img" \
            artifacts/recovery-cupid-A17.img

          sha256sum \
            artifacts/recovery-cupid-A17.img \
            > artifacts/SHA256SUMS.txt

          ls -lh artifacts/

      # ---------------------------------------------------------
      # UPLOAD
      # ---------------------------------------------------------
      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: InfinityX-Cupid-Recovery-A17
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
